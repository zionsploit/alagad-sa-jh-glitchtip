server {
    listen 80 default_server;
    server_name _; # No domain yet. Replace with: server_name glitchtip.example.com;

    access_log /var/log/nginx/access.log;

    # Must exceed GlitchTip's DATA_UPLOAD_MAX_MEMORY_SIZE (15 MB default)
    # plus multipart overhead for minidumps and source-map chunks.
    client_max_body_size 40M;

    location / {
        # web:8000 resolves over the compose network. Do NOT use
        # 127.0.0.1:8000 here -- that is localhost inside the nginx
        # container, not the web service. The host mapping 8567:8000 is
        # unaffected and remains for direct access.
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
