# Pin the project name. Without this, Compose derives it from the directory
# name, so cloning this repo as e.g. jhcsc_project_backend_prod on the server
# would collide with the existing containers/volumes (both would try to own
# <project>-web-1, <project>_pg-data, ...).
name: bug-tracker-glitchtip

x-environment: &default-environment
  # Values come from .env next to this file (see .env for docs on each).
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/postgres}
  VALKEY_URL: ${VALKEY_URL-redis://valkey:6379} # Note the dash, not colon: blank in .env disables Valkey; unset uses default
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env -- openssl rand -hex 32}
  EMAIL_URL: ${EMAIL_URL:-consolemail://} # https://glitchtip.com/documentation/install#configuration
  # Must be a full URL (scheme required) or settings.py:91 raises
  # ImproperlyConfigured and the web container crash-loops.
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-email@example.com}
  ENABLE_ADMIN: ${ENABLE_ADMIN:-False} # Set to True to enable Django Admin at /admin/
  ENABLE_OPENAPI: ${ENABLE_OPENAPI:-False} # Set to True to enable OpenAPI spec at /api/docs
  GLITCHTIP_ENABLE_MCP: ${GLITCHTIP_ENABLE_MCP:-False} # Set to True to enable MCP server
  GLITCHTIP_ENABLE_DUCKDB: ${GLITCHTIP_ENABLE_DUCKDB:-False} # Set to True to enable cold storage archival
  # PORT: 8000 # If changing, change the web service port too

  ## To reduce RAM usage (targeting 256-512 MB), consider disabling:
  # VALKEY_URL: "" # Disable Valkey, use Postgres for task queue and cache
  # GLITCHTIP_ENABLE_LOGS: "False" # Disable log ingestion
  # GLITCHTIP_ENABLE_UPTIME: "False" # Disable uptime monitoring

x-depends_on: &default-depends_on
  - postgres
  - valkey # Remove when disabling Valkey

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust" # Consider removing this and setting a password
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql
  valkey: # Recommended. Remove this service when disabling Valkey.
    image: valkey/valkey:9
    restart: unless-stopped
  web:
    image: glitchtip/glitchtip:6 # Check https://glitchtip.com/blog/ for new major versions
    depends_on: *default-depends_on
    ports:
      - "8567:8000"
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one
    restart: unless-stopped
    volumes:
      - uploads:/code/uploads
  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "8088:80" # Free on your server (used: 4004, 4005, 1234, 5432, 3308, 6381, 5672, 15672, 8567) -- http://<server>:8088
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pg-data:
  uploads: